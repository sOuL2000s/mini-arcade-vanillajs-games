<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Arcade Mania</title>
    <style>
        /* --- General & Reset --- */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: #121212;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Header --- */
        header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
            background-color: #1a1a1a;
            border-bottom: 2px solid #00ff80;
        }
        header h1 {
            font-size: 3.5em;
            color: #00ff80;
            margin: 0;
            letter-spacing: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 128, 0.5);
        }
        header p {
            font-size: 1.1em;
            color: #a0a0a0;
            margin: 5px 0 0;
        }

        /* --- Arcade Grid (Game Selection) --- */
        #arcade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            width: 90%;
            max-width: 1300px;
            padding: 40px 20px;
            box-sizing: border-box;
            transition: opacity 0.3s;
        }

        .game-card {
            background-color: #222;
            border: 1px solid #333;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
        }
        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 255, 128, 0.2);
            background-color: #2a2a2a;
            border-color: #00ff80;
        }

        .game-card h2 {
            padding: 20px 15px 10px;
            font-size: 1.5em;
            color: #fff;
            margin: 0;
        }
        .game-card p {
            padding: 0 15px 20px;
            font-size: 0.9em;
            color: #999;
        }

        /* --- Game Container (Iframe View) --- */
        #game-view-container {
            /* Initial display: none is set by JS */
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #121212;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 500;
        }
        
        #game-frame {
            /* These sizes are overridden by JS on load, set here as fallback/max */
            width: 800px; 
            height: 600px;
            border: 4px solid #00ff80;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 128, 0.5);
            background-color: #000;
            transform-origin: center center;
            max-width: 100%;
            max-height: 100%;
            transition: transform 0.2s ease;
        }
        
        /* --- Back Button --- */
        #back-button {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 10px 20px;
            background-color: #00ff80;
            color: #121212;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            z-index: 100;
        }
        
        /* --- Media Queries for Mobile Layout --- */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2.2em;
                letter-spacing: 3px;
            }
            header p {
                font-size: 0.9em;
            }
            #arcade-grid {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px 10px;
            }

            #back-button {
                top: 5px;
                right: 5px;
                padding: 8px 15px;
                font-size: 1em;
            }
        }
        
    </style>
</head>
<body>

    <header>
        <h1>Mini Arcade Mania</h1>
        <p>10 vanilla JavaScript challenges built for precision and survival.</p>
    </header>

    <!-- ARCADE GRID VIEW -->
    <div id="arcade-grid">
        <!-- Populated by JavaScript -->
    </div>

    <!-- GAME VIEW CONTAINER (Iframe) -->
    <div id="game-view-container" style="display: none;">
        <button id="back-button" onclick="unloadGame()">← Back to Arcade</button>
        <iframe id="game-frame" frameborder="0"></iframe>
    </div>

    <script>
        // Updated list with new names and dimensions
        const GAMES = [
            { title: "Neon Grid Defender", file: "ai-survival-arena.html", subtitle: "Twin-stick shooter vs. aggressive AI cubes", width: 800, height: 600 },
            { title: "Starfall Dodgem", file: "bullet-hell-survival.html", subtitle: "Dodge endless geometric projectile patterns", width: 800, height: 600 },
            { title: "The Pixel Dash", file: "endless-runner.html", subtitle: "Jump the gaps, scale the speed", width: 800, height: 250 },
            { title: "Minimal Metropolis", file: "infinite-city-builder.html", subtitle: "Minimalist grid zoning simulator", width: 800, height: 600 },
            { title: "Gravity Glide", file: "infinite-parkour-platformer.html", subtitle: "Procedurally generated jumps (Full Screen)", width: 1200, height: 800 },
            { title: "Void Runner", file: "infinite-space-survival.html", subtitle: "Navigate asteroid fields (Full Screen)", width: 1200, height: 800 },
            { title: "Vector Clicker", file: "precision-aim-trainer.html", subtitle: "Targets shrink and speed up (Full Screen)", width: 1200, height: 800 },
            { title: "Circuit Flow", file: "procedural-pipe-connect.html", subtitle: "Rotate pipes to complete the circuit", width: 800, height: 600 },
            { title: "Hyper-Click", file: "reaction-time-challenge.html", subtitle: "Click fast or click wrong, you lose! (Full Screen)", width: 1200, height: 800 },
            { title: "Coiled Destiny", file: "snake-game.html", subtitle: "Classic game with continuous difficulty", width: 400, height: 400 }
        ];

        const gridEl = document.getElementById('arcade-grid');
        const gameViewContainerEl = document.getElementById('game-view-container');
        const gameFrameEl = document.getElementById('game-frame');
        const headerEl = document.querySelector('header');


        /**
         * Dynamically generates the game cards on page load.
         */
        function initializeGrid() {
            const fragment = document.createDocumentFragment();
            GAMES.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => loadGame(game);
                
                const titleEl = document.createElement('h2');
                titleEl.textContent = game.title;
                card.appendChild(titleEl);

                const subtitleEl = document.createElement('p');
                subtitleEl.textContent = game.subtitle;
                card.appendChild(subtitleEl);

                fragment.appendChild(card);
            });
            gridEl.appendChild(fragment);
            
            window.addEventListener('resize', scaleGameFrame);
        }

        /**
         * Calculates and applies the necessary CSS scale transformation to the iframe
         * based on the game's native size and the current viewport size.
         */
        function scaleGameFrame() {
            // Find the game data based on the currently loaded iframe source
            const currentSrc = gameFrameEl.src.split('/').pop();
            const gameData = GAMES.find(g => g.file === currentSrc);
            
            if (!gameData || gameViewContainerEl.style.display === 'none') return;
            
            const nativeWidth = gameData.width;
            const nativeHeight = gameData.height;

            // Get available viewport space (account for button and padding)
            // Use 100% of viewport minus padding (20px left/right, 20px top/bottom)
            const viewportWidth = window.innerWidth - 40; 
            const viewportHeight = window.innerHeight - 40; 

            // Determine the scaling factor
            const scaleX = viewportWidth / nativeWidth;
            const scaleY = viewportHeight / nativeHeight;
            
            // Choose the smaller scale factor, capped at 1 (to prevent upscaling beyond native res)
            const scaleFactor = Math.min(1, scaleX, scaleY);
            
            // 1. Set the iframe's *native* dimensions (unscaled size)
            gameFrameEl.style.width = `${nativeWidth}px`;
            gameFrameEl.style.height = `${nativeHeight}px`;

            // 2. Apply the transformation
            gameFrameEl.style.transform = `scale(${scaleFactor})`;
        }


        /**
         * Loads a selected game into the iframe and hides the main grid.
         */
        function loadGame(game) {
            // Hide the grid and header
            gridEl.style.opacity = 0;
            gridEl.style.display = 'none';
            headerEl.style.display = 'none';
            
            // Load the game source
            gameFrameEl.src = game.file;

            // Show the game container immediately
            gameViewContainerEl.style.display = 'flex';
            
            // Adjust scaling right after loading the source (needs a slight delay for dimensions to update)
            setTimeout(scaleGameFrame, 10);

            // Focus the iframe for immediate key/mouse input
            setTimeout(() => {
                 gameFrameEl.focus();
            }, 500); 
        }

        /**
         * Clears the iframe and returns the user to the arcade grid view.
         */
        function unloadGame() {
            // Clear the iframe source
            gameFrameEl.src = '';
            
            // Remove transform styles
            gameFrameEl.style.width = '';
            gameFrameEl.style.height = '';
            gameFrameEl.style.transform = '';
            
            // Update visibility
            gameViewContainerEl.style.display = 'none';
            headerEl.style.display = 'block';
            gridEl.style.display = 'grid';
            
            // Fade grid back in
            setTimeout(() => {
                gridEl.style.opacity = 1;
            }, 50);
        }

        // Run initialization when the page is ready
        window.onload = initializeGrid;
    </script>
</body>
</html>
