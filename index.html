<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Code Core Arcade</title>
    <style>
        /* --- General & Reset --- */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: #121212;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Header --- */
        header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
            background-color: #1a1a1a;
            border-bottom: 2px solid #00ff80;
        }
        header h1 {
            font-size: 3.5em;
            color: #00ff80;
            margin: 0;
            letter-spacing: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 128, 0.5);
        }
        header p {
            font-size: 1.1em;
            color: #a0a0a0;
            margin: 5px 0 0;
        }

        /* --- Arcade Grid (Game Selection) --- */
        #arcade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            width: 90%;
            max-width: 1300px;
            padding: 40px 20px;
            box-sizing: border-box;
            transition: opacity 0.3s;
        }

        .game-card {
            background-color: #222;
            border: 1px solid #333;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
        }
        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 255, 128, 0.2);
            background-color: #2a2a2a;
            border-color: #00ff80;
        }

        .game-card h2 {
            padding: 20px 15px 10px;
            font-size: 1.5em;
            color: #fff;
            margin: 0;
        }
        .game-card p {
            padding: 0 15px 20px;
            font-size: 0.9em;
            color: #999;
        }

        /* --- Game Container (Iframe View) --- */
        #game-view-container {
            display: none; 
            width: 100vw;
            height: calc(100vh - 80px); /* Account for header height */
            position: fixed;
            top: 80px; /* Below the header */
            left: 0;
            background-color: #121212;
            
            /* Use Flexbox to center the game view */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 500; /* Ensure it stays above everything */
            
            /* Initially hidden via JS setting display: none */
        }
        
        #game-frame {
            /* We treat the iframe as a window for the fixed-size game (e.g., 800x600) */
            width: 800px; 
            height: 600px;
            border: 4px solid #00ff80;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 128, 0.5);
            background-color: #000;
            
            /* 1. Ensure it fits within the viewport */
            max-width: 100%;
            max-height: 100%;

            /* 2. Use scaling for responsiveness on small screens */
            transform-origin: center center;
            
            /* Crucial: Scale down the iframe if its native size exceeds the available space */
            transform: scale(
                min(1, 
                    calc((100vw - 40px) / 800), /* Maximize based on width */
                    calc((100vh - 150px) / 600)  /* Maximize based on height (minus button/padding) */
                )
            );
        }
        
        /* --- Back Button --- */
        #back-button {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 10px 20px;
            background-color: #00ff80;
            color: #121212;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            z-index: 100;
        }
        
        /* --- Media Queries for Mobile Layout --- */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2.2em;
                letter-spacing: 3px;
            }
            header p {
                font-size: 0.9em;
            }
            #arcade-grid {
                grid-template-columns: 1fr; /* Single column on mobile */
                gap: 20px;
                padding: 20px 10px;
            }
            .game-card h2 {
                font-size: 1.3em;
            }

            /* Adjust game frame max sizes for very small screens */
            #game-frame {
                /* The CSS transform logic handles the scaling automatically, 
                   but we ensure the container sizes are responsive */
                width: 100%; 
                height: 100%;
            }
            
            /* Move back button slightly for better mobile reach */
            #back-button {
                top: 5px;
                right: 5px;
                padding: 8px 15px;
                font-size: 1em;
            }
        }
        
    </style>
</head>
<body>

    <header>
        <h1>The Code Core Arcade</h1>
        <p>10 vanilla JavaScript challenges built for precision and survival.</p>
    </header>

    <!-- ARCADE GRID VIEW -->
    <div id="arcade-grid">
        <!-- Populated by JavaScript -->
    </div>

    <!-- GAME VIEW CONTAINER (Iframe) -->
    <!-- Note: This container is initially 'hidden' by the JS when the page loads, 
         but we set its fixed position/size in CSS -->
    <div id="game-view-container" style="display: none;">
        <button id="back-button" onclick="unloadGame()">← Back to Arcade</button>
        <iframe id="game-frame" frameborder="0"></iframe>
    </div>

    <script>
        const GAMES = [
            { title: "AI Survival Arena", file: "ai-survival-arena.html", subtitle: "Twin-stick shooter vs. AI cubes", width: 800, height: 600 },
            { title: "Bullet Hell Survival", file: "bullet-hell-survival.html", subtitle: "Dodge endless geometric patterns", width: 800, height: 600 },
            { title: "Vanilla JS Endless Runner", file: "endless-runner.html", subtitle: "Jump the gaps, scale the speed", width: 800, height: 250 },
            { title: "Infinite City Builder", file: "infinite-city-builder.html", subtitle: "Minimalist grid zoning simulator", width: 800, height: 600 },
            { title: "Infinite Parkour Platformer", file: "infinite-parkour-platformer.html", subtitle: "Procedurally generated jumps", width: 800, height: 600 },
            { title: "Infinite Space Survival", file: "infinite-space-survival.html", subtitle: "Navigate asteroid fields", width: 800, height: 600 },
            { title: "Precision Aim Trainer", file: "precision-aim-trainer.html", subtitle: "Targets shrink and speed up", width: 800, height: 600 },
            { title: "Pipe Connect Puzzle Generator", file: "procedural-pipe-connect.html", subtitle: "Rotate pipes to complete the circuit", width: 800, height: 600 },
            { title: "Reaction Time Challenge", file: "reaction-time-challenge.html", subtitle: "Click fast or click wrong, you lose!", width: 800, height: 600 },
            { title: "The Infinite Snake", file: "snake-game.html", subtitle: "Classic game with continuous difficulty", width: 400, height: 400 }
        ];

        const gridEl = document.getElementById('arcade-grid');
        const gameViewContainerEl = document.getElementById('game-view-container');
        const gameFrameEl = document.getElementById('game-frame');
        const headerEl = document.querySelector('header');


        /**
         * Dynamically generates the game cards on page load.
         */
        function initializeGrid() {
            const fragment = document.createDocumentFragment();
            GAMES.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => loadGame(game);
                
                const titleEl = document.createElement('h2');
                titleEl.textContent = game.title;
                card.appendChild(titleEl);

                const subtitleEl = document.createElement('p');
                subtitleEl.textContent = game.subtitle;
                card.appendChild(subtitleEl);

                fragment.appendChild(card);
            });
            gridEl.appendChild(fragment);
            
            // Set up resize listener for scaling adjustment
            window.addEventListener('resize', scaleGameFrame);
        }

        /**
         * Calculates and applies the necessary CSS scale transformation to the iframe
         * based on the game's native size and the current viewport size.
         */
        function scaleGameFrame() {
            const gameData = GAMES.find(g => g.file === gameFrameEl.src.split('/').pop());
            if (!gameData || gameViewContainerEl.style.display === 'none') return;
            
            const nativeWidth = gameData.width || 800; // Default to 800 if missing
            const nativeHeight = gameData.height || 600; // Default to 600 if missing

            const viewportWidth = window.innerWidth - 40; // Total horizontal space available (minus padding)
            const viewportHeight = window.innerHeight - 120; // Total vertical space available (minus header and button space)

            // Determine the scaling factor: which dimension is the bottleneck?
            const scaleX = viewportWidth / nativeWidth;
            const scaleY = viewportHeight / nativeHeight;
            
            const scaleFactor = Math.min(1, scaleX, scaleY);
            
            // Apply the transformation and set the frame's *native* dimensions
            gameFrameEl.style.width = `${nativeWidth}px`;
            gameFrameEl.style.height = `${nativeHeight}px`;
            gameFrameEl.style.transform = `scale(${scaleFactor})`;
        }


        /**
         * Loads a selected game into the iframe and hides the main grid.
         * @param {Object} game - The game object containing file, width, and height.
         */
        function loadGame(game) {
            // Hide the grid and header
            gridEl.style.opacity = 0;
            gridEl.style.display = 'none';
            headerEl.style.display = 'none';
            
            // Load the game source
            gameFrameEl.src = game.file;

            // Show the game container immediately
            gameViewContainerEl.style.display = 'flex';
            
            // Adjust scaling right after loading the source
            scaleGameFrame();

            // Focus the iframe for immediate key/mouse input
            setTimeout(() => {
                 gameFrameEl.focus();
            }, 500); // 500ms delay to ensure DOM manipulation finishes
        }

        /**
         * Clears the iframe and returns the user to the arcade grid view.
         */
        function unloadGame() {
            // Clear the iframe source
            gameFrameEl.src = '';
            
            // Update visibility
            gameViewContainerEl.style.display = 'none';
            headerEl.style.display = 'block';
            gridEl.style.display = 'grid';
            
            // Fade grid back in
            setTimeout(() => {
                gridEl.style.opacity = 1;
            }, 50);
        }

        // Run initialization when the page is ready
        window.onload = initializeGrid;
    </script>
</body>
</html>
