<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Glide</title>
    <style>
        /* --- GLOBAL RESET & BASE STYLES --- */
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            font-family: sans-serif;
            width: 100vw;
            height: 100vh;
        }

        /* --- GAME CONTAINER (Full screen) --- */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #87ceeb; /* Sky Blue */
            overflow: hidden;
        }

        /* --- WORLD CONTAINER (Handles scrolling) --- */
        #world {
            position: absolute;
            top: 0;
            left: 0;
            width: 500000px;
            height: 100%;
            will-change: transform;
        }

        /* --- PLAYER STYLES --- */
        #player {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #ff4500; /* Orange Red */
            z-index: 100;
        }

        /* --- PLATFORM STYLES --- */
        .platform {
            position: absolute;
            background-color: #008000; /* Green */
            border-bottom: 5px solid #006400; /* Darker Green for depth */
        }

        /* --- UI ELEMENTS --- */
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            color: white;
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 5px;
            z-index: 200;
        }

        /* --- GAME OVER SCREEN --- */
        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
            padding-top: 20vh;
            z-index: 300;
        }

        #game-over-screen h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }

        #game-over-screen button {
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        #game-over-screen button:hover {
            background-color: #45a049;
        }
        
        /* --- MENU OVERLAY STYLES --- */
        #menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            color: white;
            display: flex; /* Display initially */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 500;
            font-size: 1.5em;
        }

        #menu-overlay h2 {
            color: #ff4500; 
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        #menu-overlay button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 1em;
            cursor: pointer;
            background-color: #ff4500;
            color: #fff;
            border: none;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        #instructions-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            max-width: 80%;
            font-size: 0.7em;
            text-align: left;
            display: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score">Score: 0</div>
        <div id="world">
            <div id="player"></div>
        </div>
        
        <!-- NEW MENU OVERLAY -->
        <div id="menu-overlay">
            <h2>Gravity Glide</h2>
            <button id="btn-start" onclick="startGame()">Start Glide</button>
            <button id="btn-resume" style="display:none;" onclick="resumeGame()">Resume</button>
            <button id="btn-instructions" onclick="toggleInstructions()">Instructions</button>
            <div id="instructions-box">
                <h3>Controls & Goal:</h3>
                <p><strong>Goal:</strong> Travel as far right as possible by jumping between platforms.</p>
                <p><strong>Move:</strong> Left/Right Arrows or A/D.</p>
                <p><strong>Jump:</strong> Spacebar.</p>
                <p>Falling off the bottom of the screen results in Game Over.</p>
                <p>Press ESC to pause/resume the game.</p>
            </div>
        </div>

        <div id="game-over-screen">
            <h1>Game Over</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <button onclick="startGame()">Restart Game</button>
        </div>
    </div>

    <script>
        // --- GAME CONSTANTS ---
        const GRAVITY = 0.8;
        const JUMP_VELOCITY = 18;
        const RUN_SPEED = 6;
        const PLATFORM_HEIGHT = 40;
        const PLAYER_SCREEN_X = 200; 
        const CAMERA_SMOOTHING = 0.1; 

        // --- GAME STATE VARIABLES ---
        let player;
        let world;
        let scoreDisplay;
        let gameOverScreen;
        let screenHeight; 

        let platforms = [];
        let keys = {};

        let playerX = 50;
        let playerY = 0;
        let playerVelY = 0;
        let isGrounded = false;
        let isGameOver = false;
        let isGamePaused = true; // Start paused
        let score = 0;

        let lastPlatformX = 0;
        let currentLevelHeight = 0; 
        let targetWorldX = 0;
        
        // Menu Elements
        const MENU_OVERLAY = document.getElementById('menu-overlay');
        const INSTRUCTIONS_BOX = document.getElementById('instructions-box');
        const BTN_RESUME = document.getElementById('btn-resume');
        const BTN_START = document.getElementById('btn-start');


        // --- Menu Logic ---
        function toggleInstructions() {
            INSTRUCTIONS_BOX.style.display = INSTRUCTIONS_BOX.style.display === 'block' ? 'none' : 'block';
        }

        function resumeGame() {
            if (isGameOver) return;
            isGamePaused = false;
            MENU_OVERLAY.style.display = 'none';
            gameLoop();
        }

        function pauseGame() {
            if (isGameOver) return;
            isGamePaused = true;
            MENU_OVERLAY.style.display = 'flex';
            BTN_START.style.display = 'none';
            BTN_RESUME.style.display = 'block'; 
            INSTRUCTIONS_BOX.style.display = 'none';
        }

        // --- INITIALIZATION ---
        window.onload = function() {
            player = document.getElementById('player');
            world = document.getElementById('world');
            scoreDisplay = document.getElementById('score');
            gameOverScreen = document.getElementById('game-over-screen');

            screenHeight = window.innerHeight;

            setupInput();
            
            // Show menu initially
            MENU_OVERLAY.style.display = 'flex';
            gameLoop(); 
        };

        // --- INPUT HANDLING ---
        function setupInput() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    isGameOver || (isGamePaused ? resumeGame() : pauseGame());
                    return;
                }
                
                if (isGamePaused || isGameOver) return;
                
                keys[e.code] = true;
                if (e.code === 'Space' && isGrounded) {
                    playerVelY = -JUMP_VELOCITY;
                    isGrounded = false;
                }
            });
            document.addEventListener('keyup', (e) => {
                keys[e.code] = false;
            });
        }
        
        function startGame() {
            isGamePaused = false;
            isGameOver = false;
            score = 0;
            playerX = 50;
            playerY = 0;
            playerVelY = 0;
            isGrounded = false;
            platforms = [];
            lastPlatformX = 0;
            targetWorldX = 0;
            
            document.querySelectorAll('.platform').forEach(p => p.remove());

            screenHeight = window.innerHeight;
            currentLevelHeight = screenHeight - PLATFORM_HEIGHT - 100;
            playerY = currentLevelHeight - 30; 

            createPlatform(0, currentLevelHeight, 1500);

            MENU_OVERLAY.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            gameLoop(); 
        }

        // --- LEVEL GENERATION ---
        function createPlatform(x, y, width) {
            const platformEl = document.createElement('div');
            platformEl.className = 'platform';
            platformEl.style.left = `${x}px`;
            platformEl.style.top = `${y}px`;
            platformEl.style.width = `${width}px`;
            platformEl.style.height = `${PLATFORM_HEIGHT}px`;

            world.appendChild(platformEl);
            platforms.push({ x, y, width, height: PLATFORM_HEIGHT, el: platformEl });
            lastPlatformX = x + width;
        }

        function generateNextPlatform() {
            if (lastPlatformX < playerX + window.innerWidth + 500) {
                const minGap = 100;
                const maxGap = 350;
                const gap = Math.floor(Math.random() * (maxGap - minGap)) + minGap;

                const minWidth = 150;
                const maxWidth = 500;
                const width = Math.floor(Math.random() * (maxWidth - minWidth)) + minWidth;

                const newX = lastPlatformX + gap;

                const heightChange = Math.floor(Math.random() * 150) - 100;

                let newY = currentLevelHeight + heightChange;

                const screenHeight = window.innerHeight;
                newY = Math.max(screenHeight - PLATFORM_HEIGHT - 50, newY); 
                newY = Math.min(screenHeight - PLATFORM_HEIGHT - 400, newY); 

                currentLevelHeight = newY;
                createPlatform(newX, newY, width);
            }
        }

        // --- GAME LOGIC UPDATES ---
        function updatePhysics() {
            if (isGameOver || isGamePaused) return; 
            screenHeight = window.innerHeight; 

            // 1. Apply Gravity
            playerVelY += GRAVITY;

            // 2. Horizontal Movement
            let moveX = 0;
            if (keys['ArrowRight'] || keys['KeyD']) {
                moveX = RUN_SPEED;
            } else if (keys['ArrowLeft'] || keys['KeyA']) {
                moveX = -RUN_SPEED;
            }
            playerX += moveX;

            // 3. Vertical Position Update
            let newPlayerY = playerY + playerVelY;
            isGrounded = false;

            // 4. Collision Detection
            platforms.forEach(p => {
                if (
                    playerX < p.x + p.width &&
                    playerX + 30 > p.x &&
                    newPlayerY + 30 > p.y &&
                    newPlayerY < p.y + p.height
                ) {
                    if (playerVelY > 0 && playerY + 30 <= p.y) {
                        newPlayerY = p.y - 30; 
                        playerVelY = 0;
                        isGrounded = true;
                    }
                    else if (playerVelY < 0 && playerY >= p.y + p.height) {
                        playerVelY = 0; 
                        newPlayerY = p.y + p.height;
                    }
                }
            });

            playerY = newPlayerY;

            // 5. Game Over Check (Falling off screen)
            if (playerY > screenHeight) {
                endGame();
            }

            // 6. Score Update
            score = Math.floor(playerX / 10);
            scoreDisplay.textContent = `Score: ${score}`;

            // 7. Cleanup Old Platforms 
            platforms = platforms.filter(p => {
                if (p.x + p.width < playerX - window.innerWidth / 2) {
                    p.el.remove();
                    return false;
                }
                return true;
            });
        }

        // --- RENDERING & CAMERA ---
        function updateRender() {
            player.style.transform = `translate(${PLAYER_SCREEN_X}px, ${playerY}px)`;

            let desiredWorldX = -(playerX - PLAYER_SCREEN_X);
            targetWorldX += (desiredWorldX - targetWorldX) * CAMERA_SMOOTHING;

            world.style.transform = `translateX(${targetWorldX}px)`;
        }

        // --- GAME OVER ---
        function endGame() {
            if (isGameOver) return;
            isGameOver = true;
            isGamePaused = true;
            document.getElementById('final-score').textContent = score;
            gameOverScreen.style.display = 'block';
        }


        // --- MAIN GAME LOOP ---
        function gameLoop() {
            if (isGameOver) return;

            updatePhysics();
            generateNextPlatform();
            updateRender();

            if (!isGameOver) {
                requestAnimationFrame(gameLoop);
            }
        }

    </script>

</body>
</html>
